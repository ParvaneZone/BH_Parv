# .goreleaser.yaml
version: 2
project_name: backhaul

builds:
  - id: backhaul
    main: ./main.go
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: ParvaneZone
    name: BH_Parv

changelog:
  use: github
